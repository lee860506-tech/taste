plugins {
    id 'com.android.application'
}

def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def releaseUrl = localConfig.getProperty('web.base.url', 'https://taste-sooty.vercel.app/')
def debugUrl = localConfig.getProperty('web.debug.url', releaseUrl)

android {
    namespace 'com.nyamnyam.map'
    compileSdk 37

    defaultConfig {
        applicationId 'com.nyamnyam.map'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'WEB_BASE_URL', '"' + debugUrl + '"'
        }
        release {
            if (releaseUrl && !releaseUrl.startsWith('https://')) {
                throw new GradleException('web.base.url must start with https:// for release builds')
            }
            buildConfigField 'String', 'WEB_BASE_URL', '"' + releaseUrl + '"'
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
